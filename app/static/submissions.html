<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>提交中心</title><link rel="stylesheet" href="/static/styles.css"></head>
<body><div class="container"><h1>Flag / Patch 提交</h1><div id="nav" class="nav"></div>
<div class="card"><div class="row"><button onclick="loadChallenges()">加载题目</button><select id="cid"></select></div><div class="row"><input id="flag" placeholder="DINO{...}"><button onclick="submitFlag()">提交Flag</button></div><pre id="fOut"></pre><textarea id="patch" placeholder="# FIXED: ..."></textarea><div class="row"><button onclick="submitPatch()">提交Patch</button></div><pre id="pOut"></pre></div></div>
<script src="/static/common.js"></script><script>renderNav();async function loadChallenges(){const d=await api('/challenges');const s=document.getElementById('cid');s.innerHTML='';d.forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=`${c.id}-${c.name}`;s.appendChild(o);});}async function submitFlag(){try{const d=await api('/flags/submit',{method:'POST',body:JSON.stringify({challenge_id:Number(document.getElementById('cid').value),flag:v('flag')})},true);show('fOut',d);}catch(e){show('fOut',{error:e.message});}}async function submitPatch(){try{const d=await api('/patches/submit',{method:'POST',body:JSON.stringify({challenge_id:Number(document.getElementById('cid').value),patch_content:v('patch')})},true);show('pOut',d);}catch(e){show('pOut',{error:e.message});}}loadChallenges();</script></body></html>
