<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>登录注册</title><link rel="stylesheet" href="/static/styles.css"></head>
<body><div class="container"><h1>登录 / 注册</h1><div id="nav" class="nav"></div>
<div class="card"><div class="row"><input id="username" placeholder="用户名"><input id="password" type="password" placeholder="密码"></div>
<div class="row"><button onclick="register()">注册</button><button onclick="login()">登录</button></div><pre id="out"></pre></div></div>
<script src="/static/common.js"></script><script>renderNav();async function register(){try{const d=await api('/auth/register',{method:'POST',body:JSON.stringify({username:v('username'),password:v('password')})});setToken(d.access_token);show('out',d);}catch(e){show('out',{error:e.message});}}async function login(){try{const d=await api('/auth/login',{method:'POST',body:JSON.stringify({username:v('username'),password:v('password')})});setToken(d.access_token);show('out',d);}catch(e){show('out',{error:e.message});}}</script></body></html>
