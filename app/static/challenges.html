<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>题目与容器</title><link rel="stylesheet" href="/static/styles.css"></head>
<body><div class="container"><h1>题目与动态容器</h1><div id="nav" class="nav"></div>
<div class="card"><div class="row"><button onclick="loadChallenges()">刷新题目</button><select id="cid"></select><button onclick="alloc()">分配容器</button></div><pre id="chOut"></pre><pre id="cOut"></pre></div></div>
<script src="/static/common.js"></script><script>renderNav();async function loadChallenges(){try{const d=await api('/challenges');const s=document.getElementById('cid');s.innerHTML='';d.forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=`${c.id}-${c.name}`;s.appendChild(o);});show('chOut',d);}catch(e){show('chOut',{error:e.message});}}async function alloc(){try{const d=await api('/containers/allocate',{method:'POST',body:JSON.stringify({challenge_id:Number(document.getElementById('cid').value)})},true);show('cOut',d);}catch(e){show('cOut',{error:e.message});}}loadChallenges();</script></body></html>
