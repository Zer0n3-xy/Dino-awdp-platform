<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>队伍管理</title><link rel="stylesheet" href="/static/styles.css"></head>
<body><div class="container"><h1>队伍界面</h1><div id="nav" class="nav"></div>
<div class="card"><div class="row"><input id="teamName" placeholder="队伍名"><button onclick="createTeam()">创建队伍</button></div><div class="row"><input id="invite" placeholder="邀请码"><button onclick="joinTeam()">加入队伍</button></div><pre id="out"></pre></div></div>
<script src="/static/common.js"></script><script>renderNav();async function createTeam(){try{const d=await api('/teams',{method:'POST',body:JSON.stringify({name:v('teamName')})},true);document.getElementById('invite').value=d.invite_code;show('out',d);}catch(e){show('out',{error:e.message});}}async function joinTeam(){try{const d=await api(`/teams/${v('invite')}/join`,{method:'POST'},true);show('out',d);}catch(e){show('out',{error:e.message});}}</script></body></html>
