<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>比赛管理</title><link rel="stylesheet" href="/static/styles.css"></head>
<body><div class="container"><h1>创建比赛 / 比赛列表</h1><div id="nav" class="nav"></div>
<div class="card"><div class="row"><input id="name" placeholder="比赛名称" style="min-width:260px"></div><textarea id="desc" placeholder="比赛描述"></textarea><div class="row"><button onclick="createComp()">创建比赛</button><button onclick="loadComps()">刷新列表</button></div><pre id="out"></pre></div>
<div class="card"><table><thead><tr><th>ID</th><th>名称</th><th>描述</th></tr></thead><tbody id="tbody"></tbody></table></div></div>
<script src="/static/common.js"></script><script>renderNav();async function createComp(){try{const d=await api('/competitions',{method:'POST',body:JSON.stringify({name:v('name'),description:v('desc')})},true);show('out',d);loadComps();}catch(e){show('out',{error:e.message});}}async function loadComps(){try{const list=await api('/competitions');const tb=document.getElementById('tbody');tb.innerHTML='';list.forEach(i=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${i.id}</td><td>${i.name}</td><td>${i.description||''}</td>`;tb.appendChild(tr);});}catch(e){show('out',{error:e.message});}}loadComps();</script></body></html>
