<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>排行榜</title><link rel="stylesheet" href="/static/styles.css"></head>
<body><div class="container"><h1>排行榜</h1><div id="nav" class="nav"></div>
<div class="card"><div class="row"><button onclick="loadBoard()">刷新排行榜</button></div><table><thead><tr><th>#</th><th>队伍</th><th>分数</th></tr></thead><tbody id="tb"></tbody></table></div></div>
<script src="/static/common.js"></script><script>renderNav();async function loadBoard(){try{const d=await api('/leaderboard');const tb=document.getElementById('tb');tb.innerHTML='';d.forEach((i,idx)=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${idx+1}</td><td>${i.team_name}</td><td>${i.score}</td>`;tb.appendChild(tr);});}catch(e){document.getElementById('tb').innerHTML=`<tr><td colspan='3'>${e.message}</td></tr>`;}}loadBoard();</script></body></html>
