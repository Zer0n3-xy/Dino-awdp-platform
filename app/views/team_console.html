<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>队伍管理</title><style>body{margin:0;background:#0f172a;color:#e2e8f0;font-family:Arial}.container{max-width:1000px;margin:0 auto;padding:20px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.nav a{color:#93c5fd;text-decoration:none;border:1px solid #1f2937;padding:6px 10px;border-radius:8px}.card{background:#111827;border:1px solid #1f2937;border-radius:10px;padding:14px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}input,button{border-radius:8px;border:1px solid #374151;background:#0b1220;color:#e2e8f0;padding:8px 10px}button{background:#2563eb;border:none}pre{background:#020617;padding:10px;border-radius:8px}</style></head><body><div class="container"><h1>队伍管理</h1><div class="nav"><a href="/login">登录注册</a><a href="/competition-console">比赛管理</a><a href="/team-console">队伍管理</a><a href="/challenge-console">题目与容器</a><a href="/submission-console">Flag/Patch提交</a><a href="/leaderboard-console">排行榜</a></div><div class="card"><div class="row"><input id="team" placeholder="队伍名"><button onclick="createTeam()">创建队伍</button></div><div class="row"><input id="invite" placeholder="邀请码"><button onclick="joinTeam()">加入队伍</button></div><pre id="out"></pre></div></div><script>const T='awdp_token',g=()=>localStorage.getItem(T)||'';async function api(p,o={},a=false){const h={'Content-Type':'application/json',...(o.headers||{})};if(a&&g())h.Authorization=`Bearer ${g()}`;const r=await fetch(p,{...o,headers:h});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||JSON.stringify(d));return d;}const v=id=>document.getElementById(id).value.trim();const show=(id,d)=>document.getElementById(id).textContent=JSON.stringify(d,null,2);async function createTeam(){try{const d=await api('/teams',{method:'POST',body:JSON.stringify({name:v('team')})},true);document.getElementById('invite').value=d.invite_code;show('out',d);}catch(e){show('out',{error:e.message});}}async function joinTeam(){try{show('out',await api(`/teams/${v('invite')}/join`,{method:'POST'},true));}catch(e){show('out',{error:e.message});}}</script></body></html>
