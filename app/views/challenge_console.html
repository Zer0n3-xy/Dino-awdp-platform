<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>题目与容器</title><style>body{margin:0;background:#0f172a;color:#e2e8f0;font-family:Arial}.container{max-width:1000px;margin:0 auto;padding:20px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.nav a{color:#93c5fd;text-decoration:none;border:1px solid #1f2937;padding:6px 10px;border-radius:8px}.card{background:#111827;border:1px solid #1f2937;border-radius:10px;padding:14px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}button,select{border-radius:8px;border:1px solid #374151;background:#0b1220;color:#e2e8f0;padding:8px 10px}button{background:#2563eb;border:none}pre{background:#020617;padding:10px;border-radius:8px}</style></head><body><div class="container"><h1>题目与动态容器</h1><div class="nav"><a href="/login">登录注册</a><a href="/competition-console">比赛管理</a><a href="/team-console">队伍管理</a><a href="/challenge-console">题目与容器</a><a href="/submission-console">Flag/Patch提交</a><a href="/leaderboard-console">排行榜</a></div><div class="card"><div class="row"><button onclick="loadChallenges()">刷新题目</button><select id="cid"></select><button onclick="alloc()">分配容器</button></div><pre id="out1"></pre><pre id="out2"></pre></div></div><script>const T='awdp_token',g=()=>localStorage.getItem(T)||'';async function api(p,o={},a=false){const h={'Content-Type':'application/json',...(o.headers||{})};if(a&&g())h.Authorization=`Bearer ${g()}`;const r=await fetch(p,{...o,headers:h});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||JSON.stringify(d));return d;}const show=(id,d)=>document.getElementById(id).textContent=JSON.stringify(d,null,2);async function loadChallenges(){try{const d=await api('/challenges');const s=document.getElementById('cid');s.innerHTML='';d.forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=`${c.id}-${c.name}`;s.appendChild(o);});show('out1',d);}catch(e){show('out1',{error:e.message});}}async function alloc(){try{show('out2',await api('/containers/allocate',{method:'POST',body:JSON.stringify({challenge_id:Number(document.getElementById('cid').value)})},true));}catch(e){show('out2',{error:e.message});}}loadChallenges();</script></body></html>
