<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>比赛管理</title><style>body{margin:0;background:#0f172a;color:#e2e8f0;font-family:Arial}.container{max-width:1000px;margin:0 auto;padding:20px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.nav a{color:#93c5fd;text-decoration:none;border:1px solid #1f2937;padding:6px 10px;border-radius:8px}.card{background:#111827;border:1px solid #1f2937;border-radius:10px;padding:14px;margin-bottom:12px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}input,button,textarea{border-radius:8px;border:1px solid #374151;background:#0b1220;color:#e2e8f0;padding:8px 10px}button{background:#2563eb;border:none}textarea{width:100%;min-height:80px}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #1f2937;padding:6px;text-align:left}pre{background:#020617;padding:10px;border-radius:8px}</style></head><body><div class="container"><h1>比赛管理</h1><div class="nav"><a href="/login">登录注册</a><a href="/competition-console">比赛管理</a><a href="/team-console">队伍管理</a><a href="/challenge-console">题目与容器</a><a href="/submission-console">Flag/Patch提交</a><a href="/leaderboard-console">排行榜</a></div><div class="card"><div class="row"><input id="name" placeholder="比赛名称"></div><textarea id="desc" placeholder="比赛描述"></textarea><div class="row"><button onclick="createComp()">创建比赛</button><button onclick="loadComps()">刷新</button></div><pre id="out"></pre></div><div class="card"><table><thead><tr><th>ID</th><th>名称</th><th>描述</th></tr></thead><tbody id="tb"></tbody></table></div></div><script>const TOKEN_KEY='awdp_token';const getToken=()=>localStorage.getItem(TOKEN_KEY)||'';async function api(p,o={},a=false){const h={'Content-Type':'application/json',...(o.headers||{})};if(a&&getToken())h.Authorization=`Bearer ${getToken()}`;const r=await fetch(p,{...o,headers:h});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||JSON.stringify(d));return d;}const v=id=>document.getElementById(id).value.trim();const show=(id,d)=>document.getElementById(id).textContent=JSON.stringify(d,null,2);async function createComp(){try{const d=await api('/competitions',{method:'POST',body:JSON.stringify({name:v('name'),description:v('desc')})},true);show('out',d);loadComps();}catch(e){show('out',{error:e.message});}}async function loadComps(){try{const d=await api('/competitions');const tb=document.getElementById('tb');tb.innerHTML='';d.forEach(i=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${i.id}</td><td>${i.name}</td><td>${i.description||''}</td>`;tb.appendChild(tr);});}catch(e){show('out',{error:e.message});}}loadComps();</script></body></html>
