<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>排行榜</title><style>body{margin:0;background:#0f172a;color:#e2e8f0;font-family:Arial}.container{max-width:1000px;margin:0 auto;padding:20px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.nav a{color:#93c5fd;text-decoration:none;border:1px solid #1f2937;padding:6px 10px;border-radius:8px}.card{background:#111827;border:1px solid #1f2937;border-radius:10px;padding:14px}button{border-radius:8px;border:none;background:#2563eb;color:#e2e8f0;padding:8px 10px}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #1f2937;padding:6px;text-align:left}</style></head><body><div class="container"><h1>排行榜</h1><div class="nav"><a href="/login">登录注册</a><a href="/competition-console">比赛管理</a><a href="/team-console">队伍管理</a><a href="/challenge-console">题目与容器</a><a href="/submission-console">Flag/Patch提交</a><a href="/leaderboard-console">排行榜</a></div><div class="card"><p><button onclick="loadBoard()">刷新排行榜</button></p><table><thead><tr><th>#</th><th>队伍</th><th>分数</th></tr></thead><tbody id="tb"></tbody></table></div></div><script>async function api(p){const r=await fetch(p);const d=await r.json();if(!r.ok) throw new Error(d.detail||JSON.stringify(d));return d;}async function loadBoard(){try{const d=await api('/leaderboard');const tb=document.getElementById('tb');tb.innerHTML='';d.forEach((i,n)=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${n+1}</td><td>${i.team_name}</td><td>${i.score}</td>`;tb.appendChild(tr);});}catch(e){document.getElementById('tb').innerHTML=`<tr><td colspan='3'>${e.message}</td></tr>`;}}loadBoard();</script></body></html>
